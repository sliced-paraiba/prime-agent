name: Fork Release

# Builds the packed npm tarballs for a tag and publishes them as a GitHub
# release, then refreshes the rolling `channel` release whose latest.json the
# fork's self-update check reads (see DEFAULT_PRIME_AGENT_DOWNLOAD_BASE_URL in
# packages/coding-agent/src/utils/version-check.ts).
#
# Callable from upstream-sync.yml (tag pushes made with GITHUB_TOKEN do not
# trigger workflows, hence workflow_call), manually via workflow_dispatch, and
# directly on tag pushes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g., v0.9.4)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASES_BASE_URL: https://github.com/sliced-paraiba/prime-agent/releases
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack release
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm run release:pack -- \
            --channel stable \
            --version "$VERSION" \
            --base-url "$RELEASES_BASE_URL" \
            --out-dir packages/coding-agent/release/production

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=packages/coding-agent/release/production/artifacts
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARTIFACTS"/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Fork build of upstream ${RELEASE_TAG} with sliced-paraiba's system-prompt changes." \
              "$ARTIFACTS"/*
          fi

      - name: Update rolling channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=packages/coding-agent/release/production/artifacts
          if ! gh release view channel >/dev/null 2>&1; then
            gh release create channel \
              --title "Update channel manifests" \
              --notes "Rolling release hosting latest.json for the fork's self-update check. Do not delete." \
              --target main
          fi
          gh release upload channel "$ARTIFACTS/latest.json" "$ARTIFACTS/stable" --clobber
