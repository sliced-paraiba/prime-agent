[project]
name = "prime-agent-skill-attach-audio"
version = "0.1.0"
description = "Load on-disk audio files into the model's context as playable attachments."
requires-python = ">=3.10"
dependencies = ["prime-agent-runtime"]

[project.scripts]
attach_audio = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attach_audio"]
